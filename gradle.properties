org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.stdlib.default.dependency=false

pluginGroup=com.nealbayless.teststatus
pluginVersion=0.1.0

# Oldest IDE build the plugin supports (262 = 2026.2).
pluginSinceBuild=262

# IDE used for compiling and for the `runIde` sandbox. Point this at any
# WebStorm / IntelliJ-based IDE install.
localIdePath=/Applications/WebStorm.app

# Gradle itself runs on any JDK; the build compiles/tests with Java 25 (see build.gradle.kts).
# The JetBrains Runtime bundled with the IDE is a full JDK 25, so use that.
org.gradle.java.installations.paths=/Applications/WebStorm.app/Contents/jbr/Contents/Home
org.gradle.java.installations.auto-download=false
